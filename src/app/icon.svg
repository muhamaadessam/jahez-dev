<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="jahez-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5.5" result="blur" />
    </filter>
    <radialGradient id="jahez-glow-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.38" />
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="jahez-border" x1="1" y1="1" x2="47" y2="47" gradientUnits="userSpaceOnUse">
      <stop stop-color="#60A5FA" stop-opacity="0.75" />
      <stop offset="1" stop-color="#34D399" stop-opacity="0.75" />
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="46" height="46" rx="12" fill="#0F172A" stroke="url(#jahez-border)" stroke-width="1.5" />

  <!-- Ambient blurry glow -->
  <circle cx="24" cy="24" r="14" fill="url(#jahez-glow-grad)" filter="url(#jahez-glow)" />

  <!-- Left chevron `<` -->
  <path d="M15.5 17.5L10 24L15.5 30.5" stroke="#60A5FA" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Centered checkmark `✓` -->
  <path d="M19 23.5L23 28L29 17" stroke="#34D399" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Right chevron `>` -->
  <path d="M32.5 17.5L38 24L32.5 30.5" stroke="#60A5FA" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
</svg>
